# ============================================================
# NGINX DU CONTENEUR FRONTEND (Web Map)
# - sert le build React (SPA)
# - proxy /api/* -> backend NestJS (nestjs_backend:4000)
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    # DNS interne Docker : le backend est résolu à la demande,
    # le conteneur démarre même si le backend est momentanément arrêté.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/xml;

    # Healthcheck Docker / Jenkins
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # --------------------------------------------------------
    # API : /api/auth/login  ->  http://nestjs_backend:4000/auth/login
    # --------------------------------------------------------
    location /api/ {
        set $backend http://nestjs_backend:4000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Fichiers statiques versionnés (hash dans le nom) : cache long
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html : jamais en cache (pour récupérer les nouveaux builds)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA : toutes les routes React renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}